[project]
name = "japanese-immersion-parser"
version = "0.1.0"
description = "JLPT grammar & vocabulary parser for Japanese immersion reading (FastAPI + SudachiPy)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jip
      POSTGRES_PASSWORD: jip
      POSTGRES_DB: jip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jip -d jip"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      JIP_DATABASE_URL: postgresql://jip:jip@db:5432/jip
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
